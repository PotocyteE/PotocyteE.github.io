<html lang="en">
<head>

<title>Rise of the Modern Global Economy — MC Practice</title>
<style>
:root { --ink:#1c1917; --muted:#57534e; --line:#e7e5e4; --bg:#fafaf9; --card:#fff; --accent:#1d4ed8; --ok:#166534; --bad:#991b1b; }
* { box-sizing:border-box; }
body { margin:0; font-family: Georgia, "Times New Roman", serif; background:var(--bg); color:var(--ink); }
header { background:#1e293b; color:#fff; padding:24px 18px 18px; }
header h1, header p, .wrap { max-width:860px; margin-left:auto; margin-right:auto; }
header h1 { font-size:1.4rem; margin:0; font-weight:600; }
header p { margin:8px auto 0; color:#cbd5e1; font-family:system-ui,sans-serif; font-size:.92rem; line-height:1.45; }
.wrap { padding:16px; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 14px; }
.tabs button { font-family:system-ui,sans-serif; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px; cursor:pointer; }
.tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:0 0 12px; }
.stem { margin:0 0 10px; font-size:1.02rem; line-height:1.5; }
.opts { display:flex; flex-direction:column; gap:8px; }
label.opt { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer; font-family:system-ui,sans-serif; font-size:.96rem; line-height:1.4; }
label.opt.correct { border-color:var(--ok); background:#f0fdf4; }
label.opt.wrong { border-color:var(--bad); background:#fef2f2; }
.why { display:none; margin-top:10px; font-family:system-ui,sans-serif; font-size:.9rem; color:#44403c; line-height:1.45; }
.card.show .why { display:block; }
.bar { position:sticky; bottom:0; background:rgba(250,250,249,.96); border-top:1px solid var(--line); padding:12px; display:flex; gap:10px; justify-content:center; }
.bar button { font-family:system-ui,sans-serif; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:12px 16px; font-size:1rem; cursor:pointer; }
.bar button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
#score { font-family:system-ui,sans-serif; font-size:1.1rem; margin:0 0 10px; }
.hidden { display:none; }
</style>
</head>
<body>

<p>Practice MC questions for Lectures 1–3. English only. One best answer. Based on the lecture notes, not an official paper.</p>

let current = 1;
const quiz = document.getElementById("quiz");
const scoreEl = document.getElementById("score");
function render(lec) {
  current = lec;
  quiz.innerHTML = "";
  scoreEl.classList.add("hidden");
  data[lec].forEach((item, i) => {
    const card = document.createElement("section");
    card.className = "card";
    const opts = item.options.map((text, j) =>
      `<label class="opt"><input type="radio" name="q${lec}-${i}" value="${j}"><span><strong>${String.fromCharCode(65+j)})</strong> ${text.replace(/\n/g,"<br>")}</span></label>`
    ).join("");
    card.innerHTML = `<p class="stem"><strong>${i+1}.</strong> ${item.q.replace(/\n/g,"<br>")}</p><div class="opts">${opts}</div><p class="why"><strong>Rationale.</strong> ${item.why}</p>`;
    quiz.appendChild(card);
  });
  document.querySelectorAll(".tabs button").forEach(btn => btn.classList.toggle("on", Number(btn.dataset.lec) === lec));
  window.scrollTo({top:0, behavior:"smooth"});
}
document.querySelectorAll(".tabs button").forEach(btn => {
  btn.onclick = () => render(Number(btn.dataset.lec));
});
document.getElementById("submit").onclick = () => {
  let score = 0;
  const items = data[current];
  document.querySelectorAll(".card").forEach((card, i) => {
    card.classList.add("show");
    const chosen = card.querySelector("input:checked");
    const pick = chosen ? Number(chosen.value) : -1;
    card.querySelectorAll(".opt").forEach((lab, j) => {
      lab.classList.remove("correct","wrong");
      if (j === items[i].a) lab.classList.add("correct");
      else if (j === pick) lab.classList.add("wrong");
    });
    if (pick === items[i].a) score++;
  });
  scoreEl.classList.remove("hidden");
  scoreEl.textContent = `Lecture ${current} score: ${score} / ${items.length}`;
  scoreEl.scrollIntoView({behavior:"smooth"});
};
document.getElementById("reset").onclick = () => render(current);
render(1);
</script>
